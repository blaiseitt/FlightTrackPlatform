# config/flight-tracker-service.yml

server:
  port: 8081

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/flightplatform

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: flight-tracker-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.flightplatform.common.event"
        spring.json.value.default.type: com.flightplatform.common.event.FlightPositionEvent