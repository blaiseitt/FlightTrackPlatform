input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [service] {
    mutate { add_field => { "app" => "%{service}" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "flights-%{[app]}-%{+YYYY.MM.dd}"
  }

  stdout { codec => rubydebug }
}